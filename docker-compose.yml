name: openchamber

services:
  openchamber:
    image: ghcr.io/amirghaghighi/openchamber:${IMAGE_TAG:-latest}
    container_name: openchamber
    ports:
      # Both sides follow OPENCHAMBER_PORT (defaults 3000). For network_mode:
      # host, ports is ignored — the container port comes from the entrypoint.
      - "${OPENCHAMBER_PORT:-3000}:${OPENCHAMBER_PORT:-3000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - openchamber-config:/home/openchamber/.config/openchamber
      - opencode-share:/home/openchamber/.local/share/opencode
      - opencode-state:/home/openchamber/.local/state/opencode
      - opencode-config:/home/openchamber/.config/opencode
      - ssh-keys:/home/openchamber/.ssh
      - ./workspaces:/home/openchamber/workspaces
    environment:
      # Docker binds OpenChamber to 0.0.0.0, so UI auth is required.
      # Set this before starting, for example:
      #   OPENCHAMBER_UI_PASSWORD="$(openssl rand -base64 24)" docker compose up -d
      OPENCHAMBER_UI_PASSWORD: ${OPENCHAMBER_UI_PASSWORD:?Set OPENCHAMBER_UI_PASSWORD before exposing OpenChamber through Docker}
      # Optional: LAN address pairing links offer (empty = upstream default).
      OPENCHAMBER_LAN_URL: ${OPENCHAMBER_LAN_URL:-}
      # Entrypoint env (repo-local): translated to --port by docker-entrypoint.sh.
      # Empty = image CMD default (3000).
      OPENCHAMBER_PORT: ${OPENCHAMBER_PORT:-}
      # Upstream env: bind address (bare IP, no scheme). Empty = entrypoint
      # default 0.0.0.0 (upstream default 127.0.0.1 would block mapped ports).
      OPENCHAMBER_HOST: ${OPENCHAMBER_HOST:-}
    # OPENCODE_HOST: http://host.docker.internal:4096  # use external OpenCode server
    # OPENCODE_SKIP_START: true  # with OPENCODE_HOST, skip managed OpenCode
    restart: unless-stopped

volumes:
  openchamber-config:
  opencode-share:
  opencode-state:
  opencode-config:
  ssh-keys:
