name: docker-publish

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - .github/workflows/docker-publish.yml
  workflow_dispatch:
    inputs:
      openchamber_version:
        description: OpenChamber version (@openchamber/web)
        default: "2.2.0"
      opencode_version:
        description: OpenCode version (@opencode/cli)
        default: "2.0.25"
  schedule:
    - cron: "0 3 * * 1" # weekly rebuild on fresh base, Mondays 03:00 UTC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: amirghaghighi/openchamber

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve versions
        run: |
          echo "OPENCHAMBER_VERSION=${{ inputs.openchamber_version || '2.2.0' }}" >> "$GITHUB_ENV"
          echo "OPENCODE_VERSION=${{ inputs.opencode_version || '2.0.25' }}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.OPENCHAMBER_VERSION }}
            type=sha,prefix=${{ env.OPENCHAMBER_VERSION }}-,format=short

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENCHAMBER_VERSION=${{ env.OPENCHAMBER_VERSION }}
            OPENCODE_VERSION=${{ env.OPENCODE_VERSION }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Sign images
        run: echo "${{ steps.meta.outputs.tags }}" | xargs -I {} cosign sign --yes {}@${{ steps.build.outputs.digest }}
