name: weekly-respin

# Proposes a fresh rebuild on updated apt packages. A human merges;
# the merge changes versions.env, which fires docker-publish.
# Never publishes directly.
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

jobs:
  respin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Bump builder rev
        run: |
          set -eu
          current="$(sed -e 's/#.*//' versions.env | grep -E '^[[:space:]]*BUILDER_VERSION[[:space:]]*=' | sed -e 's/^[^=]*=//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$current" ]; then
            echo "error: BUILDER_VERSION missing in versions.env" >&2
            exit 1
          fi
          major="$(echo "$current" | cut -d. -f1)"
          minor="$(echo "$current" | cut -d. -f2)"
          patch="$(echo "$current" | cut -d. -f3)"
          next="${major}.${minor}.$((patch + 1))"
          sed -i -E "s/^(BUILDER_VERSION[[:space:]]*=[[:space:]]*).*/\1${next}/" versions.env
          echo "NEXT_BUILDER_VERSION=${next}" >> "$GITHUB_ENV"

      - name: Open respin PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: weekly-respin-${{ env.NEXT_BUILDER_VERSION }}
          title: "chore: weekly respin (builder ${{ env.NEXT_BUILDER_VERSION }})"
          body: "Refresh apt layer on the pinned base image. Merge to publish; close to skip this week."
          commit-message: "chore: weekly respin (builder ${{ env.NEXT_BUILDER_VERSION }})"
