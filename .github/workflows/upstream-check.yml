name: upstream-check

# Checks npm for new @openchamber/web and @opencode/cli releases,
# GitHub for new cli/cli (gh) releases, Docker Hub for a new
# node:24-bookworm-slim digest, and download.docker.com for a new
# docker-ce-cli release.
# Opens a PR only when an upstream pin actually changed; merging it
# changes versions.env, which fires docker-publish.
# Never publishes directly.
on:
  schedule:
    - cron: "0 3 * * *" # Daily 03:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Check upstream releases
        run: |
          set -eu
          current() {
            sed -e 's/#.*//' versions.env \
              | grep -E "^[[:space:]]*$1[[:space:]]*=" \
              | sed -e 's/^[^=]*=//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          }
          CURRENT_OC="$(current OPENCHAMBER_VERSION)"
          CURRENT_CODE="$(current OPENCODE_VERSION)"
          CURRENT_GH="$(current GH_VERSION)"
          CURRENT_NODE="$(current NODE_IMAGE_DIGEST)"
          CURRENT_DOCKER_CLI="$(current DOCKER_CLI_VERSION)"
          LATEST_OC="$(curl -fsSL https://registry.npmjs.org/@openchamber%2Fweb/latest | jq -r .version)"
          LATEST_CODE="$(curl -fsSL https://registry.npmjs.org/@opencode%2Fcli/latest | jq -r .version)"
          LATEST_GH="$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest | jq -r .tag_name | sed 's/^v//')"
          LATEST_NODE="$(curl -fsSL https://hub.docker.com/v2/repositories/library/node/tags/24-bookworm-slim | jq -r .digest)"
          LATEST_DOCKER_CLI="$(curl -fsSL https://download.docker.com/linux/debian/dists/bookworm/stable/binary-amd64/Packages \
            | awk '/^Package: docker-ce-cli$/{f=1;next} /^$/{f=0} f && /^Version: /{print}' \
            | sed -E 's/^Version: 5:([0-9]+\.[0-9]+\.[0-9]+).*/\1/' \
            | sort -V | tail -n 1)"
          if [ -z "$LATEST_OC" ] || [ "$LATEST_OC" = "null" ]; then
            echo "error: could not resolve latest @openchamber/web version" >&2
            exit 1
          fi
          if [ -z "$LATEST_CODE" ] || [ "$LATEST_CODE" = "null" ]; then
            echo "error: could not resolve latest @opencode/cli version" >&2
            exit 1
          fi
          if [ -z "$LATEST_GH" ] || [ "$LATEST_GH" = "null" ]; then
            echo "error: could not resolve latest cli/cli version" >&2
            exit 1
          fi
          if ! printf '%s' "$LATEST_NODE" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "error: could not resolve latest node:24-bookworm-slim digest (got '${LATEST_NODE}')" >&2
            exit 1
          fi
          if ! printf '%s' "$LATEST_DOCKER_CLI" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: could not resolve latest docker-ce-cli version (got '${LATEST_DOCKER_CLI}')" >&2
            exit 1
          fi
          echo "openchamber: current=$CURRENT_OC latest=$LATEST_OC"
          echo "opencode: current=$CURRENT_CODE latest=$LATEST_CODE"
          echo "gh: current=$CURRENT_GH latest=$LATEST_GH"
          echo "node digest: current=$CURRENT_NODE latest=$LATEST_NODE"
          echo "docker-ce-cli: current=$CURRENT_DOCKER_CLI latest=$LATEST_DOCKER_CLI"
          CHANGED=false
          if [ "$LATEST_OC" != "$CURRENT_OC" ]; then
            sed -i -E "s/^(OPENCHAMBER_VERSION[[:space:]]*=[[:space:]]*).*/\1${LATEST_OC}/" versions.env
            CHANGED=true
          fi
          if [ "$LATEST_CODE" != "$CURRENT_CODE" ]; then
            sed -i -E "s/^(OPENCODE_VERSION[[:space:]]*=[[:space:]]*).*/\1${LATEST_CODE}/" versions.env
            CHANGED=true
          fi
          if [ "$LATEST_GH" != "$CURRENT_GH" ]; then
            sed -i -E "s/^(GH_VERSION[[:space:]]*=[[:space:]]*).*/\1${LATEST_GH}/" versions.env
            CHANGED=true
          fi
          if [ "$LATEST_NODE" != "$CURRENT_NODE" ]; then
            sed -i -E "s|^(NODE_IMAGE_DIGEST[[:space:]]*=[[:space:]]*).*|\1${LATEST_NODE}|" versions.env
            CHANGED=true
          fi
          if [ "$LATEST_DOCKER_CLI" != "$CURRENT_DOCKER_CLI" ]; then
            sed -i -E "s/^(DOCKER_CLI_VERSION[[:space:]]*=[[:space:]]*).*/\1${LATEST_DOCKER_CLI}/" versions.env
            CHANGED=true
          fi
          echo "LATEST_OC=${LATEST_OC}" >> "$GITHUB_ENV"
          echo "LATEST_CODE=${LATEST_CODE}" >> "$GITHUB_ENV"
          echo "LATEST_GH=${LATEST_GH}" >> "$GITHUB_ENV"
          # Branch names cannot contain ':' — use the 12-char digest prefix.
          NODE_SHORT="$(echo "$LATEST_NODE" | sed 's/^sha256://' | cut -c1-12)"
          echo "LATEST_NODE_SHORT=${NODE_SHORT}" >> "$GITHUB_ENV"
          echo "LATEST_DOCKER_CLI=${LATEST_DOCKER_CLI}" >> "$GITHUB_ENV"
          echo "UPSTREAM_CHANGED=${CHANGED}" >> "$GITHUB_ENV"
          if [ "$CHANGED" = true ]; then
            echo "Upstream changed — versions.env updated."
          else
            echo "Upstream unchanged — nothing to do."
          fi

      - name: Open upstream bump PR
        if: env.UPSTREAM_CHANGED == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: upstream-${{ env.LATEST_OC }}-${{ env.LATEST_CODE }}-gh${{ env.LATEST_GH }}-docker${{ env.LATEST_DOCKER_CLI }}-node${{ env.LATEST_NODE_SHORT }}
          title: "chore: bump upstream (openchamber ${{ env.LATEST_OC }}, opencode ${{ env.LATEST_CODE }}, gh ${{ env.LATEST_GH }}, docker-cli ${{ env.LATEST_DOCKER_CLI }}, node ${{ env.LATEST_NODE_SHORT }})"
          body: "New upstream release(s) detected on npm / GitHub / Docker Hub / download.docker.com. Merge to publish; close to skip."
          commit-message: "chore: bump upstream (openchamber ${{ env.LATEST_OC }}, opencode ${{ env.LATEST_CODE }}, gh ${{ env.LATEST_GH }}, docker-cli ${{ env.LATEST_DOCKER_CLI }}, node ${{ env.LATEST_NODE_SHORT }})"
