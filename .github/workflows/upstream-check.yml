name: upstream-check

# Checks npm for new @openchamber/web and @opencode/cli releases,
# plus GitHub for new cli/cli (gh) releases.
# Opens a PR only when an upstream pin actually changed; merging it
# changes versions.env, which fires docker-publish.
# Never publishes directly.
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream releases
        run: |
          set -eu
          current() {
            sed -e 's/#.*//' versions.env \
              | grep -E "^[[:space:]]*$1[[:space:]]*=" \
              | sed -e 's/^[^=]*=//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          }
          CURRENT_OC="$(current OPENCHAMBER_VERSION)"
          CURRENT_CODE="$(current OPENCODE_VERSION)"
          CURRENT_GH="$(current GH_VERSION)"
          LATEST_OC="$(curl -fsSL https://registry.npmjs.org/@openchamber%2Fweb/latest | jq -r .version)"
          LATEST_CODE="$(curl -fsSL https://registry.npmjs.org/@opencode%2Fcli/latest | jq -r .version)"
          LATEST_GH="$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest | jq -r .tag_name | sed 's/^v//')"
          if [ -z "$LATEST_OC" ] || [ "$LATEST_OC" = "null" ]; then
            echo "error: could not resolve latest @openchamber/web version" >&2
            exit 1
          fi
          if [ -z "$LATEST_CODE" ] || [ "$LATEST_CODE" = "null" ]; then
            echo "error: could not resolve latest @opencode/cli version" >&2
            exit 1
          fi
          if [ -z "$LATEST_GH" ] || [ "$LATEST_GH" = "null" ]; then
            echo "error: could not resolve latest cli/cli version" >&2
            exit 1
          fi
          echo "openchamber: current=$CURRENT_OC latest=$LATEST_OC"
          echo "opencode: current=$CURRENT_CODE latest=$LATEST_CODE"
          echo "gh: current=$CURRENT_GH latest=$LATEST_GH"
          CHANGED=false
          if [ "$LATEST_OC" != "$CURRENT_OC" ]; then
            sed -i -E "s/^(OPENCHAMBER_VERSION[[:space:]]*=[[:space:]]*).*/\1${LATEST_OC}/" versions.env
            CHANGED=true
          fi
          if [ "$LATEST_CODE" != "$CURRENT_CODE" ]; then
            sed -i -E "s/^(OPENCODE_VERSION[[:space:]]*=[[:space:]]*).*/\1${LATEST_CODE}/" versions.env
            CHANGED=true
          fi
          if [ "$LATEST_GH" != "$CURRENT_GH" ]; then
            sed -i -E "s/^(GH_VERSION[[:space:]]*=[[:space:]]*).*/\1${LATEST_GH}/" versions.env
            CHANGED=true
          fi
          echo "LATEST_OC=${LATEST_OC}" >> "$GITHUB_ENV"
          echo "LATEST_CODE=${LATEST_CODE}" >> "$GITHUB_ENV"
          echo "LATEST_GH=${LATEST_GH}" >> "$GITHUB_ENV"
          echo "UPSTREAM_CHANGED=${CHANGED}" >> "$GITHUB_ENV"
          if [ "$CHANGED" = true ]; then
            echo "Upstream changed — versions.env updated."
          else
            echo "Upstream unchanged — nothing to do."
          fi

      - name: Open upstream bump PR
        if: env.UPSTREAM_CHANGED == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: upstream-${{ env.LATEST_OC }}-${{ env.LATEST_CODE }}-gh${{ env.LATEST_GH }}
          title: "chore: bump upstream (openchamber ${{ env.LATEST_OC }}, opencode ${{ env.LATEST_CODE }}, gh ${{ env.LATEST_GH }})"
          body: "New upstream release(s) detected on npm / GitHub. Merge to publish; close to skip."
          commit-message: "chore: bump upstream (openchamber ${{ env.LATEST_OC }}, opencode ${{ env.LATEST_CODE }}, gh ${{ env.LATEST_GH }})"
